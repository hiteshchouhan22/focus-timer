name: Capture store screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Run the app on an emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            tap_text() {
              adb shell uiautomator dump /sdcard/ui.xml > /dev/null
              adb pull /sdcard/ui.xml ui.xml > /dev/null
              bounds=$(grep -o "text=\"$1\"[^>]*" ui.xml | grep -o 'bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' | head -1)
              coords=$(echo "$bounds" | sed -E 's/.*\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\].*/\1 \2 \3 \4/')
              set -- $coords
              if [ -n "$1" ]; then
                adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
              else
                echo "Could not find UI element with text: $1"
              fi
            }
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.shadowboxstudios.focustimer/.MainActivity
            sleep 4
            adb exec-out screencap -p > shot-1-focus.png
            tap_text "Break 5"
            sleep 1
            adb exec-out screencap -p > shot-2-break.png
            tap_text "Start"
            sleep 3
            adb exec-out screencap -p > shot-3-running.png
            ls -la shot-*.png

      - name: Publish screenshots as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create screenshots shot-1-focus.png shot-2-break.png shot-3-running.png \
            --title "Store screenshots" \
            --notes "Real screenshots of Focus Timer captured on an emulator by GitHub Actions." \
          || gh release upload screenshots shot-1-focus.png shot-2-break.png shot-3-running.png --clobber

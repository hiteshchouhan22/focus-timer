name: Capture store screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Run the app on an emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/capture.sh

      - name: Publish screenshots as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create screenshots shot-1-focus.png shot-2-break.png shot-3-running.png \
            --title "Store screenshots" \
            --notes "Real screenshots of Focus Timer captured on an emulator by GitHub Actions." \
          || gh release upload screenshots shot-1-focus.png shot-2-break.png shot-3-running.png --clobber
